name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Lets a run be triggered by hand from the Actions tab or the API, which is the
  # first thing you'll want after enabling Actions on the repository.
  workflow_dispatch:
  schedule:
    # Catch upstream drift in the live provider APIs even when nobody pushes.
    - cron: "17 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests + lint
    runs-on: ubuntu-latest
    # Backs the Postgres-backed storage tests below. Unlike the NHTSA job, this is a
    # disposable service container, not a third-party dependency — it belongs in the
    # hermetic job, not "live-providers".
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pypdf

      - name: Lint
        run: ruff check src tests

      - name: Tests
        run: pytest -q

      - name: Ingestion smoke test
        run: |
          aad ingest add data/samples
          aad ingest stats

      - name: Evaluation harness refuses a synthetic corpus
        run: |
          if aad eval --goldset data/eval/sample_goldset.jsonl; then
            echo "::error::eval reported accuracy over synthetic data; the refusal is broken"
            exit 1
          fi
          echo "eval correctly refuses to score synthetic material"

      - name: Evaluation harness self-test
        # Not an accuracy claim — this exercises the scorer and, critically, guards
        # the extraction relevance gate that stops an absent component picking up an
        # unrelated torque value.
        run: aad eval --goldset data/eval/sample_goldset.jsonl --allow-synthetic

      - name: Grounding monitor catches a planted fabrication
        # End-to-end proof the zero-tolerance gate is live: a value that is not in the
        # source must exit non-zero. If this step ever passes, the monitor is broken
        # and no other green check means anything.
        run: |
          mkdir -p /tmp/monitor-check
          printf 'Tighten the camshaft position sensor bolt to 9 N·m (80 in-lb).\n' \
            > /tmp/monitor-check/source.txt
          printf 'Torque the camshaft position sensor bolt to 47 N·m.\n' \
            > /tmp/monitor-check/fabricated.txt
          printf 'Torque the camshaft position sensor bolt to 9 N·m.\n' \
            > /tmp/monitor-check/grounded.txt
          if aad monitor verify --output /tmp/monitor-check/fabricated.txt \
               --source manual#c1=/tmp/monitor-check/source.txt \
               --question "cam sensor bolt torque" --task-type torque_spec; then
            echo "::error::the monitor passed a fabricated torque value"
            exit 1
          fi
          aad monitor verify --output /tmp/monitor-check/grounded.txt \
            --source manual#c1=/tmp/monitor-check/source.txt \
            --question "cam sensor bolt torque" --task-type torque_spec
          echo "monitor blocks fabrications and passes grounded values"

      - name: Durable storage (Postgres) round-trip
        # Proves AAD_STORAGE_BACKEND=postgres actually works, not just that its SQL
        # parses — the offline cache and the monitor's audit log get a real schema
        # created and a real row written and read back.
        env:
          AAD_LIVE_TESTS: "1"
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aad_test
        run: pytest -q -m live tests/test_storage.py

      - name: Index readiness gate
        # Must report NOT ready: the sample corpus is synthetic. If this ever
        # passes on the sample data, the synthetic guard has regressed.
        run: |
          if aad verify-index --production; then
            echo "::error::verify-index --production passed on synthetic sample data; the guard is broken"
            exit 1
          fi
          echo "verify-index correctly refuses synthetic corpus"

  live-providers:
    name: live provider APIs (NHTSA)
    runs-on: ubuntu-latest
    # Separate job so an upstream NHTSA outage is distinguishable from a code
    # failure at a glance, instead of turning the whole suite red for a reason
    # that has nothing to do with the diff.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Reachability
        run: aad doctor

      - name: Live NHTSA tests
        env:
          AAD_LIVE_TESTS: "1"
        run: pytest -q -m live
