[project]
name = "aad"
version = "0.1.0"
description = "Auto mechanic diagnostic assistant: grounded RAG over OEM service data with VIN/OBD2/torque/labor/parts tooling."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "numpy>=1.26",
    # The Pinecone and OpenAI-embedding backends avoid a new dependency by calling
    # their plain REST APIs over httpx. Postgres has no such shortcut — it needs a
    # real wire-protocol driver — so it's a core dependency rather than an optional
    # extra: AAD_STORAGE_BACKEND=postgres has to work whichever way this package
    # was installed on the host actually running it (notably Vercel's build, which
    # installs [project.dependencies] directly rather than any extras group).
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
aad = "aad.cli:main"
aad-ingest = "aad.ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aad"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
# Live tests hit real third-party services. Deselected by default so the suite
# stays hermetic; CI runs them in a separate job via `-m live`.
addopts = "-m 'not live'"
markers = [
    "live: exercises a real external service (needs network and AAD_LIVE_TESTS=1)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# `Depends(...)` in a default argument is FastAPI's documented dependency-injection
# idiom, not the mutable-default bug B008 is looking for.
"src/aad/api/app.py" = ["B008"]
